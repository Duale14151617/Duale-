name: Unzip project

# Upload any .zip to the repo root (Add file -> Upload files). This runs by itself, extracts every zip in the
# root over the repo (paths inside the zip are kept), deletes the zip and commits. No file name to type.
# You can also run it by hand from the Actions tab (leave the field empty to unzip every zip in the root).
on:
  push:
    branches: [ "main" ]
    paths: [ "*.zip" ]
  workflow_dispatch:
    inputs:
      zip:
        description: "Optional: one zip file name in the repo root (empty = all zips)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: unzip-project
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract
        env:
          ZIP_INPUT: ${{ inputs.zip }}
        run: |
          if [ -n "$ZIP_INPUT" ]; then bash scripts/unzip-zips.sh "$ZIP_INPUT"; else bash scripts/unzip-zips.sh; fi

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nothing to commit."; exit 0; }
          git commit -m "Unzip project"
          git pull --rebase
          git push
